name: build-docker

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # REQUIRED to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/metho:latest \
                       -t ghcr.io/${{ github.repository_owner }}/metho:${{ github.sha }} \
                       .

      - name: Verify runtime binaries
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/metho:latest \
            sh -c 'subfaster -h 2>&1 | grep -q . && \
                   httpx -h 2>&1 | grep -q . && \
                   katana -h 2>&1 | grep -q . && \
                   dnsx -h 2>&1 | grep -q . && \
                   shuffledns -h 2>&1 | grep -q . && \
                   massdns 2>&1 | grep -q . && \
                   waymore --help 2>&1 | grep -q . && \
                   test -f /opt/tools/SubDomainizer/SubDomainizer.py && \
                   test -f /opt/tools/cloud_enum/cloud_enum.py && \
                   python3 -c "import bs4, requests, termcolor, colorama, tldextract, cffi, dns.resolver, requests_futures" && \
                   echo "All runtime tools OK"'

      - name: Verify pipeline scripts
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/metho:latest \
            sh -c 'bash -n /opt/scripts/recon.sh && \
                   bash -n /opt/scripts/lib/utils.sh && \
                   bash -n /opt/scripts/lib/phase1.sh && \
                   bash -n /opt/scripts/lib/phase2.sh && \
                   bash -n /opt/scripts/lib/phase3.sh && \
                   bash -n /opt/scripts/lib/consolidate.sh && \
                   bash -n /opt/scripts/lib/canonical_dns.sh && \
                   bash -n /opt/scripts/lib/classify.sh && \
                   bash -n /opt/scripts/config/asn_providers.sh && \
                   echo "All scripts OK"'

      - name: Print image size
        run: |
          IMAGE_SIZE=$(docker images ghcr.io/${{ github.repository_owner }}/metho:latest --format "{{.Size}}")
          echo "Image size: ${IMAGE_SIZE}"

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/metho:latest
          docker push ghcr.io/${{ github.repository_owner }}/metho:${{ github.sha }}
