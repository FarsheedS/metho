name: build-docker-artifacts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t metho .

      - name: Verify runtime binaries
        run: |
          docker run --rm --entrypoint sh metho -c 'subfaster -h 2>&1 | grep -q . && \
                   httpx -h 2>&1 | grep -q . && \
                   katana -h 2>&1 | grep -q . && \
                   dnsx -h 2>&1 | grep -q . && \
                   naabu -h 2>&1 | grep -q . && \
                   github-subdomains -h 2>&1 | grep -q . && \
                   waymore --help 2>&1 | grep -q . && \
                   test -f /opt/tools/SubDomainizer/SubDomainizer.py && \
                   test -f /opt/tools/cloud_enum/cloud_enum.py && \
                   echo "All runtime tools OK"'

      - name: Verify pipeline scripts
        run: |
          docker run --rm --entrypoint sh metho -c 'bash -n /opt/scripts/recon.sh && \
                   bash -n /opt/scripts/lib/utils.sh && \
                   bash -n /opt/scripts/lib/phase1.sh && \
                   bash -n /opt/scripts/lib/phase2.sh && \
                   bash -n /opt/scripts/lib/phase3.sh && \
                   bash -n /opt/scripts/lib/consolidate.sh && \
                   bash -n /opt/scripts/lib/canonical_dns.sh && \
                   bash -n /opt/scripts/lib/classify.sh && \
                   bash -n /opt/scripts/lib/results.sh && \
                   bash -n /opt/scripts/config/asn_providers.sh && \
                   echo "All scripts OK"'

      - name: Run unit tests
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD/tests:/opt/scripts/tests:ro" \
            metho /opt/scripts/tests/run_tests.sh

      - name: Print image size
        run: |
          IMAGE_SIZE=$(docker images metho --format "{{.Size}}")
          echo "Image size: ${IMAGE_SIZE}"

      - name: Save image to tar
        run: docker save metho -o metho.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metho
          path: metho.tar