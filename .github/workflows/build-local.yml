name: build-docker-artifacts

on:
  workflow_dispatch:

jobs:
  build:
    # arm64, built on a native arm64 runner.
    #
    # This workflow produces the tarball that gets `docker load`ed on an Apple
    # silicon Mac. Built on ubuntu-latest (amd64) it produced an amd64 image,
    # which Docker Desktop then ran under x86 emulation — every Go tool in the
    # image (subfaster, httpx, dnsx, naabu, katana, github-subdomains) and every
    # Ruby/Python helper paid translation cost for the whole run.
    #
    # Nothing in the Dockerfile had to change to fix that: there is no --platform
    # pinning, no TARGETARCH/GOARCH, and no prebuilt binary — every tool is
    # `go install`ed, so the architecture simply follows the build host. The only
    # lever is where the build runs.
    #
    # The tradeoff, stated plainly: this yields an ARM-ONLY image, so the artifact
    # no longer runs on an amd64 host without emulation. That is the right default
    # while the consumer is one arm64 Mac; if the image is ever needed on an amd64
    # box (a Linux VPS, say), this job should become a two-leg matrix on
    # `ubuntu-latest` + `ubuntu-24.04-arm` with per-arch artifact names, rather
    # than switching back.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t metho .

      - name: Verify build architecture
        run: |
          # The whole point of this workflow is the architecture, and a silent
          # regression to amd64 (a runner label change, a future --platform flag
          # added to the build) would be invisible until a run felt slow. Assert
          # it here, where the cost of finding out is a failed job rather than a
          # wasted reconnaissance sweep.
          ARCH=$(docker run --rm --entrypoint sh metho -c 'uname -m')
          echo "Image architecture: ${ARCH}"
          case "$ARCH" in
            aarch64|arm64) ;;
            *) echo "::error::expected an arm64 image, got ${ARCH}" >&2; exit 1 ;;
          esac

      - name: Verify runtime binaries
        run: |
          docker run --rm --entrypoint sh metho -c 'subfaster -h 2>&1 | grep -q . && \
                   httpx -h 2>&1 | grep -q . && \
                   katana -h 2>&1 | grep -q . && \
                   dnsx -h 2>&1 | grep -q . && \
                   naabu -h 2>&1 | grep -q . && \
                   github-subdomains -h 2>&1 | grep -q . && \
                   waymore --help 2>&1 | grep -q . && \
                   test -f /opt/tools/SubDomainizer/SubDomainizer.py && \
                   test -f /opt/tools/cloud_enum/cloud_enum.py && \
                   echo "All runtime tools OK"'

      - name: Verify pipeline scripts
        run: |
          docker run --rm --entrypoint sh metho -c 'bash -n /opt/scripts/recon.sh && \
                   bash -n /opt/scripts/lib/utils.sh && \
                   bash -n /opt/scripts/lib/phase1.sh && \
                   bash -n /opt/scripts/lib/phase2.sh && \
                   bash -n /opt/scripts/lib/phase3.sh && \
                   bash -n /opt/scripts/lib/consolidate.sh && \
                   bash -n /opt/scripts/lib/canonical_dns.sh && \
                   bash -n /opt/scripts/lib/classify.sh && \
                   bash -n /opt/scripts/lib/results.sh && \
                   bash -n /opt/scripts/entrypoint.sh && \
                   bash -n /opt/scripts/config/asn_providers.sh && \
                   echo "All scripts OK"'

      - name: Verify DoH proxy
        run: |
          # The DoH proxy carries every DNS query in the default dns-mode.
          # Compile it and exercise argument parsing so a broken proxy fails
          # the build rather than the first run.
          docker run --rm --entrypoint sh metho -c 'python3 -m py_compile /opt/scripts/lib/doh_proxy.py && \
                   python3 /opt/scripts/lib/doh_proxy.py --help > /dev/null && \
                   echo "DoH proxy OK"'

      - name: Run unit tests
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD/tests:/opt/scripts/tests:ro" \
            metho /opt/scripts/tests/run_tests.sh

      - name: Print image size
        run: |
          IMAGE_SIZE=$(docker images metho --format "{{.Size}}")
          echo "Image size: ${IMAGE_SIZE}"

      - name: Save image to tar
        run: docker save metho -o metho.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metho
          path: metho.tar